<svg xmlns="http://www.w3.org/2000/svg" width="3900" height="3570" viewBox="0 0 3900 3570" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Cine Bogotá: arquitectura políglota con relaciones directas</title>
<desc id="descripcion">Diecinueve tablas PostgreSQL y cuatro colecciones MongoDB con líneas directas entre claves foráneas e identificadores compartidos.</desc>
