<text x="2103" y="348" class="docTitle">fichas_tecnicas_peliculas</text>
<text x="2103" y="395" class="docBody">_id · titulo · pais_origen · actualizado_en</text>
<text x="2103" y="425" class="docBody">[R] id_pelicula → Pelicula.id_pelicula</text>
<text x="2103" y="455" class="docBody">[R] id_clasificacion_pelicula → Clasificacion_Pelicula</text>
<text x="2103" y="485" class="docBody">[E] version {codigo, formato, duracion_minutos}</text>
<text x="2103" y="515" class="docBody">[E] elenco[] {nombre, rol_en_pelicula,</text>
<text x="2103" y="545" class="docBody">       [R] id_actor_director → Actor_Director}</text>
<text x="2103" y="575" class="docBody">[E] idiomas_audio[] · subtitulos[]</text>
<text x="2103" y="605" class="docBody">[E] clasificaciones_por_pais[] {pais, sistema, etiqueta,</text>
<text x="2103" y="635" class="docBody">       [R] id_clasificacion_pelicula opcional}</text>
<rect x="2085" y="760" width="835" height="385" rx="5" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="2087" y="762" width="831" height="47" rx="4" fill="#ededed"/>
<path d="M2086 809 H2919" stroke="#222" stroke-width="2"/>
<text x="2103" y="793" class="docTitle">requisitos_proyeccion</text>
<text x="2103" y="840" class="docBody">_id · fecha_funcion · estado_validacion · observado_en</text>
<text x="2103" y="870" class="docBody">[R] id_funcion → Funcion.id_funcion</text>
<text x="2103" y="900" class="docBody">[R] id_pelicula → Pelicula.id_pelicula</text>
<text x="2103" y="930" class="docBody">[R] id_sala → Sala.id_sala</text>
<text x="2103" y="960" class="docBody">[E] proyeccion {formato, resolucion,</text>
<text x="2103" y="990" class="docBody">       relacion_aspecto, audio}</text>
<text x="2103" y="1020" class="docBody">[E] requerimientos[] {codigo, estado, detalle, obligatorio}</text>
<rect x="2085" y="1205" width="835" height="385" rx="5" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="2087" y="1207" width="831" height="47" rx="4" fill="#ededed"/>
<path d="M2086 1254 H2919" stroke="#222" stroke-width="2"/>
<text x="2103" y="1238" class="docTitle">resenas_peliculas</text>
<text x="2103" y="1285" class="docBody">_id · calificacion · texto · fecha</text>
<text x="2103" y="1315" class="docBody">[R] id_pelicula → Pelicula.id_pelicula</text>
<text x="2103" y="1345" class="docBody">[R] id_espectador → Espectador.id_espectador</text>
<text x="2103" y="1375" class="docBody">[E] respuesta_empresa {mensaje, fecha} o null</text>
<rect x="2085" y="1650" width="835" height="385" rx="5" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="2087" y="1652" width="831" height="47" rx="4" fill="#ededed"/>
<path d="M2086 1699 H2919" stroke="#222" stroke-width="2"/>
<text x="2103" y="1683" class="docTitle">reportes_incidentes</text>
<text x="2103" y="1730" class="docBody">_id · tipo · fecha · severidad · estado · descripcion</text>
<text x="2103" y="1760" class="docBody">[R] id_funcion → Funcion.id_funcion</text>
<text x="2103" y="1790" class="docBody">[R] id_sala → Sala.id_sala</text>
<text x="2103" y="1820" class="docBody">[R] id_venta → Venta.id_venta (opcional)</text>
<text x="2103" y="1850" class="docBody">[R] id_espectador → Espectador.id_espectador (opcional)</text>
<text x="2103" y="1880" class="docBody">[E] detalles {campos según tipo}</text>
<text x="2103" y="1910" class="docBody">[E] reportado_por {tipo, [R] id_staff → Staff.id_staff}</text>
<text x="2103" y="1940" class="docBody">actualizado_en</text>
