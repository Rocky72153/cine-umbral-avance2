<line x1="55" y1="2160" x2="2945" y2="2160" stroke="#222" stroke-width="2"/>
<text x="55" y="2198" class="legend">PK  clave primaria     FK  clave foránea en PostgreSQL     [R]  identificador compartido     [E]  dato embebido</text>
<text x="55" y="2234" class="legend">Las referencias entre motores no son claves foráneas: la aplicación debe comprobar la existencia de los IDs al escribir.</text>
