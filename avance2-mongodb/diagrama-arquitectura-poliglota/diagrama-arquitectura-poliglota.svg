<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2280" viewBox="0 0 3000 2280" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Cine Bogotá: arquitectura políglota PostgreSQL y MongoDB</title>
<desc id="descripcion">Modelo relacional con diecinueve tablas y cuatro colecciones documentales. Las referencias entre motores se identifican por sus campos y son validadas por la aplicación.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333"/></marker></defs>
